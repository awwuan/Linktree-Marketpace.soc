    <!-- Javascript untuk Animasi Titik Jatuh -->
    <script>
        const canvas = document.getElementById('falling-dots');
        const ctx = canvas.getContext('2d');
        let width, height, dots = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            dots = [];
            for (let i = 0; i < 40; i++) {
                dots.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    speedY: (Math.random() * 1.5 + 0.5), // Kecepatan positif agar jatuh ke bawah
                    speedX: (Math.random() - 0.5) * 0.5, // Sedikit goyangan ke samping
                    opacity: Math.random() * 0.5 + 0.1
                });
            }
        }

        function animateDots() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#c1b49a'; // Warna titik dari brand

            dots.forEach(dot => {
                ctx.globalAlpha = dot.opacity;
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.size, 0, Math.PI * 2);
                ctx.fill();

                dot.x += dot.speedX;
                dot.y += dot.speedY;

                // Reset ke atas layar jika sudah melewati batas bawah
                if (dot.y > height) {
                    dot.y = -10;
                    dot.x = Math.random() * width;
                }
            });
            requestAnimationFrame(animateDots);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        animateDots();
    </script>
