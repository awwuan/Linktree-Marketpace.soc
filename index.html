<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketpace.soc - Running Essentials</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:ital,wght@0,400;0,600;0,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icon -->
    <link rel="shortcut icon" href="/assets/Logo.jpg" type="image/x-icon">

     <!-- Tailwind Config to match design colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0c1014', // Sangat gelap, hampir hitam
                            tan: '#c1b49a', // Warna teks "SPEND SMART"
                            gray: '#8e9397', // Warna teks kecil
                            darkbtn: '#1a2024', // Background tombol dark
                            darkbtnhover: '#242b30',
                            wa1: '#219643', // Gradien WA kiri
                            wa2: '#1b7d36', // Gradien WA kanan
                            shopee: '#ee4d2d',
                        }
                    },
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    backgroundImage: {
                        'radial-glow': 'radial-gradient(circle at top, #1f2a33 0%, #0c1014 50%)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles untuk memastikan detail kecil sesuai */
        body {
            background-color: #0c1014;
            color: white;
            /* Efek background radial subtle untuk meniru pencahayaan di gambar */
            background-image: radial-gradient(circle at 50% 10%, rgba(30, 41, 51, 0.5) 0%, rgba(12, 16, 20, 1) 60%);
            
            /* Perubahan Utama: Memastikan tinggi mentok layar dan tanpa scroll */
            height: 100dvh; 
            overflow: hidden;
        }

        .letter-spacing-widest {
            letter-spacing: 0.15em;
        }

        .letter-spacing-wide {
            letter-spacing: 0.05em;
        }

        /* ANIMASI MODERN BARU */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-breathe {
            animation: breathe 15s ease-in-out infinite;
        }
        
        #mouse-glow {
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(193, 180, 154, 0.08), transparent 40%);
            transition: opacity 0.5s ease;
        }
    </style>
</head>

<body class="font-inter antialiased flex flex-col items-center justify-between">

    <!-- Modern Premium Background -->
    <div class="fixed inset-0 z-[-1] pointer-events-none bg-brand-bg overflow-hidden">
        <!-- Animated Ambient Glows (Warna emas/tan dari brand) -->
        <div
            class="absolute -top-[20%] -right-[10%] w-[60vw] h-[60vw] max-w-[600px] max-h-[600px] rounded-full bg-brand-tan opacity-[0.08] blur-[80px] sm:blur-[120px] animate-[pulse_6s_ease-in-out_infinite]">
        </div>
        <div
            class="absolute -bottom-[10%] -left-[10%] w-[50vw] h-[50vw] max-w-[500px] max-h-[500px] rounded-full bg-white opacity-[0.03] blur-[80px] sm:blur-[100px] animate-[pulse_8s_ease-in-out_infinite_reverse]">
        </div>

        <!-- Modern Technical Grid (Kesan sporty & terstruktur) -->
        <div
            class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:40px_40px] [mask-image:radial-gradient(ellipse_80%_80%_at_50%_0%,#000_40%,transparent_100%)] -webkit-mask-image:-webkit-radial-gradient(ellipse_80%_80%_at_50%_0%,#000_40%,transparent_100%)">
        </div>

        <!-- Texture Aksi Berlari (Tema Running) -->
        <div class="absolute inset-0 opacity-40" style="background-image: url('https://images.unsplash.com/photo-1552674605-171ff535c5c8?q=80&w=2070&auto=format&fit=crop'); 
                    background-size: cover; 
                    background-position: center top; 
                    filter: grayscale(100%) contrast(120%);
                    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%); 
                    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);">
        </div>
    </div>

    <!-- Container Utama (Dibuat justify-center agar merata posisinya dan flex-1 untuk mengisi sisa ruang) -->
    <main class="w-full max-w-md px-6 flex flex-col items-center justify-center flex-1 min-h-0">

        <!-- Logo Section (Margin diperkecil agar muat di HP) -->
        <div class="flex flex-col items-center mb-3 sm:mb-4">
            <!-- Mockup Logo MP -->
            <img src="/assets/Logo.jpg"
                class="w-20 h-20 sm:w-24 sm:h-24 bg-black rounded-full flex flex-col items-center justify-center shadow-[0_0_20px_rgba(255,255,255,0.05)] border border-gray-800">
            </img>
        </div>

        <!-- Headline Texts -->
        <div class="text-center mb-4 sm:mb-6">
            <h2 class="font-inter font-semibold text-sm sm:text-sm text-white mb-1.5 letter-spacing-widest">
                JERSEY RUNNING BARU & PRELOVED
            </h2>
            <p
                class="font-inter text-[10px] sm:text-xs text-brand-gray letter-spacing-wide flex items-center justify-center gap-2">
                KUALITAS TERPILIH <span class="text-[8px]">•</span> HARGA BERSAHABAT
            </p>
        </div>

        <!-- Features Icons Row (Padding & Margin diperkecil) -->
        <div
            class="flex justify-center items-center w-full gap-3 sm:gap-6 mb-5 sm:mb-8 border-t border-b border-gray-800/50 py-3">
            <!-- Feature 1 -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6 text-brand-tan opacity-80" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="m9 12 2 2 4-4"></path>
                </svg>
                <span class="text-[8px] sm:text-[10px] text-gray-300 font-medium leading-tight">100%<br>ORIGINAL</span>
            </div>
            <div class="w-[1px] h-5 bg-gray-800"></div> <!-- Divider -->
            <!-- Feature 2 -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6 text-brand-tan opacity-80" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="7"></circle>
                    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                </svg>
                <span class="text-[8px] sm:text-[10px] text-gray-300 font-medium leading-tight">KONDISI<br>TERPILIH</span>
            </div>
            <div class="w-[1px] h-5 bg-gray-800"></div> <!-- Divider -->
            <!-- Feature 3 -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6 text-brand-tan opacity-80" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
                    </path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <span class="text-[8px] sm:text-[10px] text-gray-300 font-medium leading-tight">CEPAT<br>& AMAN</span>
            </div>
        </div>

        <!-- Links Container (Gap dirapatkan agar hemat tempat di layar kecil) -->
        <div class="w-full flex flex-col gap-3 sm:gap-4 w-full">

            <!-- WhatsApp Button -->
            <a href="wa.me/6289657042555"
                class="group w-full bg-gradient-to-r from-brand-wa1 to-brand-wa2 p-3 sm:p-4 rounded-2xl sm:rounded-3xl flex items-center justify-between hover:scale-[1.02] transition-transform duration-300 shadow-[0_10px_20px_rgba(33,150,67,0.15)]">
                <div class="flex items-center gap-3 sm:gap-4">
                    <!-- WA Icon Box -->
                    <div
                        class="w-10 h-10 sm:w-12 sm:h-12 bg-white/20 rounded-xl sm:rounded-2xl flex items-center justify-center backdrop-blur-sm shadow-inner">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-7 sm:h-7 text-white" viewBox="0 0 24 24"
                            fill="currentColor">
                            <path
                                d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-white text-sm sm:text-base">Chat via WhatsApp</h3>
                        <p class="text-green-100 text-[10px] sm:text-xs mt-0.5">Fast Response</p>
                    </div>
                </div>
                <div class="text-white opacity-80 group-hover:opacity-100 group-hover:translate-x-1 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            </a>

            <!-- Shopee Button -->
            <a href="https://shp.ee/fTyzj8Xe"
                class="group w-full bg-brand-darkbtn hover:bg-brand-darkbtnhover p-3 sm:p-4 rounded-2xl sm:rounded-3xl flex items-center justify-between hover:scale-[1.02] transition-transform duration-300 border border-gray-800 shadow-lg">
                <div class="flex items-center gap-3 sm:gap-4">
                    <!-- Shopee Icon Box (Icon Tas Belanja) -->
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-[#1f2529] rounded-xl sm:rounded-2xl flex items-center justify-center shadow-inner text-brand-shopee">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-white text-sm sm:text-base">Shopee Store</h3>
                        <!-- Deskripsi diubah menjadi CTA -->
                        <p class="text-brand-shopee text-[10px] sm:text-xs mt-0.5 font-medium">Pesan Sekarang via Shopee 🛍️</p>
                    </div>
                </div>
                <div class="text-gray-400 group-hover:text-white group-hover:translate-x-1 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            </a>

            <!-- Tokopedia Button -->
            <a href="https://tk.tokopedia.com/ZSxnGJBP1/"
                class="group w-full bg-brand-darkbtn hover:bg-brand-darkbtnhover p-3 sm:p-4 rounded-2xl sm:rounded-3xl flex items-center justify-between hover:scale-[1.02] transition-transform duration-300 border border-gray-800 shadow-lg">
                <div class="flex items-center gap-3 sm:gap-4">
                    <!-- Tokopedia Icon Box (Icon Tas Belanja) -->
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-[#1f2529] rounded-xl sm:rounded-2xl flex items-center justify-center shadow-inner text-[#42B549]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-white text-sm sm:text-base">Tokopedia Store</h3>
                        <!-- Deskripsi diubah menjadi CTA -->
                        <p class="text-[#42B549] text-[10px] sm:text-xs mt-0.5 font-medium">Pesan Sekarang via Tokopedia ✨</p>
                    </div>
                </div>
                <div class="text-gray-400 group-hover:text-white group-hover:translate-x-1 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            </a>

        </div>
    </main>

    <!-- Footer Section -->
    <footer class="w-full max-w-md flex flex-col items-center border-t border-gray-800/50 py-4 mt-auto">
        <!-- Instagram Link -->
        <a href="https://instagram.com/marketpace.soc" target="_blank"
            class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            <span class="font-inter text-xs sm:text-sm tracking-wide">@marketpace.soc</span>
        </a>
    </footer>

</body>

</html>
