    <!-- Javascript untuk Animasi Interaktif -->
    <script>
        // 1. Interactive Mouse Glow (Sorot kursor mengikuti mouse - Hanya aktif di Desktop)
        const glow = document.getElementById('mouse-glow');
        window.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            glow.style.setProperty('--mouse-x', `${x}px`);
            glow.style.setProperty('--mouse-y', `${y}px`);
        });

        // 2. Speed Sparks Canvas (Efek partikel energi lari)
        const canvas = document.getElementById('speed-sparks');
        const ctx = canvas.getContext('2d');
        let width, height, sparks = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            sparks = [];
            // Buat 40 partikel energi
            for (let i = 0; i < 40; i++) {
                sparks.push(createSpark());
            }
        }

        function createSpark() {
            return {
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5 + 0.5, // Ukuran kecil
                speedY: (Math.random() * 1.5 + 0.5) * -1, // Bergerak ke atas (spirit/pace)
                speedX: (Math.random() - 0.5) * 0.5, // Sedikit bergoyang ke samping
                opacity: Math.random() * 0.5 + 0.1
            };
        }

        function animateSparks() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#c1b49a'; // Warna brand-tan (emas/khaki)

            sparks.forEach(spark => {
                ctx.globalAlpha = spark.opacity;
                ctx.beginPath();
                ctx.arc(spark.x, spark.y, spark.size, 0, Math.PI * 2);
                ctx.fill();

                // Pergerakan
                spark.x += spark.speedX;
                spark.y += spark.speedY;

                // Reset posisi jika keluar layar dari atas
                if (spark.y < 0) {
                    spark.y = height;
                    spark.x = Math.random() * width;
                }
            });
            
            requestAnimationFrame(animateSparks);
        }

        // Jalankan animasi saat halaman dimuat
        window.addEventListener('resize', initCanvas);
        initCanvas();
        animateSparks();
    </script>
