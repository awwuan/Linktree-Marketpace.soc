    <script>
        const glow = document.getElementById('mouse-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.setProperty('--mouse-x', `${e.clientX}px`);
            glow.style.setProperty('--mouse-y', `${e.clientY}px`);
        });

        const canvas = document.getElementById('speed-sparks');
        const ctx = canvas.getContext('2d');
        let width, height, sparks = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            sparks = [];
            for (let i = 0; i < 40; i++) sparks.push({ x: Math.random() * width, y: Math.random() * height, size: Math.random() * 1.5 + 0.5, speedY: (Math.random() * 1.5 + 0.5) * -1, speedX: (Math.random() - 0.5) * 0.5, opacity: Math.random() * 0.5 + 0.1 });
        }

        function animateSparks() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#c1b49a';
            sparks.forEach(s => {
                ctx.globalAlpha = s.opacity;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                s.x += s.speedX;
                s.y += s.speedY;
                if (s.y < 0) { s.y = height; s.x = Math.random() * width; }
            });
            requestAnimationFrame(animateSparks);
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();
        animateSparks();
    </script>
